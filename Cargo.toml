[workspace]
members = [".", "crates/ntgcalls-sys"]
resolver = "2"

[package]
name = "quill"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
license = "MIT"
description = "Independent GPUI + TDLib Telegram desktop client (working name Quill)"
repository = "https://github.com/shinycake/quill"
publish = false

[features]
default = ["ui"]
ui = ["dep:gpui-kit", "dep:objc2-app-kit", "dep:raw-window-handle", "dep:image", "dep:smallvec", "dep:qrcode", "dep:tray-icon", "dep:ureq", "dep:objc2", "dep:objc2-foundation", "dep:objc2-av-foundation", "dep:block2", "dep:objc2-core-media", "dep:objc2-core-video", "dep:core-video", "dep:core-foundation", "dep:rodio", "dep:ogg", "dep:opus-decoder"]
# Development only: `--screenshot-demo` also rasterizes the window in-process
# when QUILL_DEMO_CAPTURE=<file.png> is set (no screen-recording permission).
demo-capture = ["ui", "gpui-kit/test-support"]

[dependencies]
base64 = "0.22"
directories = "6"
flate2 = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"], optional = true }
libloading = "0.8"
libc = "0.2"
ntgcalls-sys = { path = "crates/ntgcalls-sys" }
qrcode = { version = "0.14", optional = true, default-features = false, features = ["image"] }
rand = "0.8"
# Window handles: macOS sharing type, Windows display affinity (capture blocking).
raw-window-handle = { version = "0.6.2", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
semver = "1"
# In-process audio: call tones, notification sounds, voice/audio playback
# (CoreAudio / WASAPI / ALSA via cpal; MP3/AAC/FLAC/Vorbis/WAV via symphonia).
rodio = { version = "0.22", optional = true, default-features = false, features = ["playback", "flac", "mp3", "mp4", "vorbis", "wav"] }
# Ogg/Opus voice notes (symphonia has no Opus decoder): pure-Rust Ogg demux
# and RFC 8251-conformant Opus decoder, no C dependency.
ogg = { version = "0.9", optional = true }
opus-decoder = { version = "0.1", optional = true }
ureq = { version = "3.4", default-features = false, features = ["rustls"], optional = true }
sha2 = "0.10"
smallvec = { version = "1", optional = true }
thiserror = "2"
tray-icon = { version = "0.21", optional = true, default-features = false }
unicode-segmentation = "1.13"
unicode-bidi = "0.3"
spellbook = "0.4"
encoding_rs = "0.8"
zeroize = { version = "1", features = ["zeroize_derive"] }
interprocess = { version = "2", default-features = false }

[dependencies.gpui-kit]
version = "=0.7.0"
optional = true
default-features = false
features = ["component", "assets"]

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["NSMenu", "NSView", "NSWindow", "NSPasteboard", "NSPasteboardItem", "NSImage", "NSFont", "NSStringDrawing", "NSAttributedString", "NSImageRep", "NSBitmapImageRep", "NSGraphics", "NSSpellChecker"], optional = true }
# Native video playback (AVPlayer → CVPixelBuffer → GPUI surface).
objc2 = { version = "0.6", optional = true }
objc2-foundation = { version = "0.3.2", optional = true, default-features = false, features = ["std", "NSString", "NSURL", "NSDictionary", "NSValue", "NSObject", "NSError", "NSArray", "NSData", "NSGeometry", "NSAttributedString", "NSRange", "NSLocale"] }
objc2-av-foundation = { version = "0.3.2", optional = true, default-features = false, features = ["std", "objc2-core-media", "objc2-core-video", "AVPlayer", "AVPlayerItem", "AVPlayerItemOutput", "AVAsset", "AVTime", "AVMediaFormat", "AVCaptureDevice", "block2"] }
block2 = { version = "0.6", optional = true }
objc2-core-media = { version = "0.3.2", optional = true, default-features = false, features = ["std", "CMTime"] }
objc2-core-video = { version = "0.3.2", optional = true, default-features = false, features = ["std", "CVPixelBuffer", "CVImageBuffer", "CVBuffer", "CVReturn"] }
core-video = { version = "0.5.2", optional = true }
core-foundation = { version = "0.10.1", optional = true }

[dev-dependencies]
pretty_assertions = "1"
unicode-bidi-mirroring = "0.4"

[[bin]]
name = "quill"
path = "src/main.rs"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"

# Local iteration: keep only line tables in the top crate and strip debuginfo
# from external dependencies entirely (workspace path deps like
# ntgcalls-sys keep line tables — Cargo ignores package overrides for
# workspace members). Release profile is untouched; use
# `--profile debugging` (full debuginfo) when real debug info is needed.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.debugging]
inherits = "dev"
debug = true

[target.'cfg(windows)'.build-dependencies]
# Application icon resource (build.rs).
embed-resource = "3"

[target.'cfg(windows)'.dependencies]
# Local time zone offsets; secret chats kept out of screen capture.
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Cryptography", "Win32_Storage_FileSystem", "Win32_System_Console", "Win32_System_Registry", "Win32_System_Time", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
# ISpellChecker (Windows 8+ Spell Checking API), as tdesktop's spellcheck_win.cpp.
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Globalization", "Win32_System_Com"] }

# Right-to-left composer typing (docs/decisions/codex-rtl-composer.md): gpui-base
# 0.7.0 with a bidi-aware input engine. The commit that adds third_party/gpui-base is
# the pristine registry copy, so a diff against it isolates the patch.
[patch.crates-io]
gpui-base = { path = "third_party/gpui-base" }
