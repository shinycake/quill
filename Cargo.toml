[workspace]
members = [".", "crates/quill-calls-sys", "crates/webview-protocol", "crates/webview-host"]
resolver = "2"

# Never crash (docs/contributing/panic-safety.md, phases A and B). Test code is
# exempt through clippy.toml. The vendored third_party crates are not members
# and do not inherit these.
[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
exit = "deny"
undocumented_unsafe_blocks = "deny"
string_slice = "deny"
unchecked_time_subtraction = "deny"
indexing_slicing = "deny"

[package]
name = "quill"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
license = "MIT"
description = "Quill, an independent, unofficial Telegram desktop client built on GPUI and TDLib"
repository = "https://github.com/shinycake/quill"
publish = false
# quill-cli is a small helper; `cargo run` means the app.
default-run = "quill"

[lints]
workspace = true

[features]
default = ["ui"]
# Only enabled through the dev-dependency below; only for test targets.
test-support = []
ui = [
    "dep:gpui-kit",
    "dep:gpui-base",
    "dep:inventory",
    "dep:objc2-app-kit",
    "dep:raw-window-handle",
    "dep:image",
    "dep:fast_image_resize",
    "dep:moxcms",
    "dep:smallvec",
    "dep:qrcode",
    "dep:tray-icon",
    "dep:ksni",
    "dep:zbus",
    "dep:ashpd",
    "dep:gpui_wgpu",
    "dep:objc2-media-player",
    "dep:objc2-user-notifications",
    "dep:ureq",
    "dep:objc2",
    "dep:objc2-foundation",
    "dep:objc2-av-foundation",
    "dep:block2",
    "dep:objc2-core-media",
    "dep:objc2-core-video",
    "dep:rodio",
    "dep:ogg",
    "dep:opus-decoder",
    "dep:cpal",
    "dep:rusty-opus",
    "dep:resvg",
    "dep:gpui_macos",
    "dep:gpui_windows",
    "dep:objc2-image-io",
    "dep:objc2-core-graphics",
    "dep:objc2-core-foundation",
    "dep:objc2-screen-capture-kit",
    "dep:dispatch2",
    "dep:jxl-oxide",
    "dep:objc2-core-bluetooth",
    "dep:objc2-core-location",
    "dep:async-io",
    "dep:futures-lite",
]
# Development only: `--screenshot-demo` also rasterizes the window in-process
# when QUILL_DEMO_CAPTURE=<file.png> is set (no screen-recording permission).
demo-capture = ["ui", "gpui-kit/test-support"]
# Developer frame profiling: GPUI frame histograms + debug overlay
# (QUILL_FRAME_PROFILE=<report path>). See src/ui/frame_profile.rs.
frame-profiler = ["ui", "gpui-kit/profiler"]

[dependencies]
base64 = { version = "0.23", default-features = false, features = ["std"] }
idna = "1"
directories = "6"
flate2 = "1"
# Image files sent as documents: the formats tdesktop previews in-app
# (core/mime_type.cpp DetectNameType). HEIC/HEIF/AVIF/JPEG XL decode through
# the platform (src/ui/image_decode/).
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "bmp", "gif", "ico", "tiff", "qoi", "tga"], optional = true }
fast_image_resize = { version = "6", optional = true }
# ICC colour management for decoded image files (already in the tree via `image`).
moxcms = { version = "0.8", optional = true }
# JPEG XL image files on Windows and Linux, and on macOS before ImageIO reads
# them (pure Rust, colour-managed through moxcms).
jxl-oxide = { version = "0.12", optional = true, default-features = false, features = ["rayon", "moxcms"] }
libloading = "0.9"
libc = "0.2"
log = "0.4"
quill-calls-sys = { path = "crates/quill-calls-sys" }
qrcode = { version = "0.14", optional = true, default-features = false, features = ["image"] }
rand = "0.10"
# Window handles: macOS sharing type, Windows display affinity (capture blocking).
raw-window-handle = { version = "0.6.2", optional = true }
serde = { version = "1", features = ["derive"] }
# preserve_order: `quill agent connect --yes` rewrites the user's MCP config
# with its keys in their order. GPUI turns it on too, but core builds need it.
serde_json = { version = "1", features = ["preserve_order"] }
semver = "1"
# In-process audio: call tones, notification sounds, voice/audio playback
# (CoreAudio / WASAPI / ALSA via cpal; MP3/AAC/FLAC/Vorbis/WAV via symphonia).
rodio = { version = "0.23", optional = true, default-features = false, features = ["playback", "flac", "mp3", "mp4", "vorbis", "wav"] }
# Ogg/Opus voice notes (symphonia has no Opus decoder): pure-Rust Ogg demux
# and RFC 8251-conformant Opus decoder, no C dependency.
ogg = { version = "0.9", optional = true }
opus-decoder = { version = "0.1", optional = true }
# Voice-note recording: microphone via cpal (same backend rodio plays
# through) and a pure-Rust Opus encoder, muxed with `ogg`. No external binary.
cpal = { version = "0.18", optional = true, default-features = false }
# Call noise suppression (docs/decisions/call-capture.md): RNNoise ported to
# Rust, run on Quill's own 10 ms microphone frames before tgcalls encodes
# them. Pure Rust; the library only, not its command-line tool.
nnnoiseless = { version = "0.5.2", default-features = false }
rusty-opus = { version = "1", optional = true }
# Wallpaper patterns: Telegram ships them as (gzipped) SVG. Already in the
# lockfile through GPUI; no text or raster-image features are needed.
resvg = { version = "0.49", default-features = false, features = ["svgz"], optional = true }
ureq = { version = "3.5", default-features = false, features = ["rustls"], optional = true }
sha2 = "0.11"
# Emoji set packs (docs/decisions/emoji-set-style.md): stored (uncompressed)
# zip entries only. The Windows in-app updater (src/update_install/bundle.rs)
# also reads the deflated release zip, hence the pure-Rust inflate backend.
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs"] }
# Linux in-app updater: reads the release tarball (flate2 above does the gunzip).
tar = { version = "0.4", default-features = false }
# Local passcode (docs/decisions/codex-local-passcode.md): PBKDF2-HMAC-SHA512 key
# derivation and an XChaCha20-Poly1305 key wrap; no hand-rolled crypto.
pbkdf2 = { version = "0.13", default-features = false, features = ["hmac"] }
chacha20poly1305 = { version = "0.11", features = ["zeroize"] }
smallvec = { version = "1", optional = true }
# Interface scale (docs/decisions/codex-interface-scale-full.md): the platform
# decorator names GPUI's oneshot receiver type. Already in the lockfile via GPUI.
futures-channel = "0.3"
# Mini apps (docs/decisions/codex-miniapp-webview.md): the wire types shared
# with the quill-webview helper process.
quill-webview-protocol = { path = "crates/webview-protocol" }
# Screenshot demos and kit dialogs register themselves next to their code
# (docs/decisions/codex-refactor-1.md, codex-refactor-2.md). Already in the
# lockfile via GPUI.
inventory = { version = "0.3", optional = true }
# Animated sticker frame store (docs/decisions/sticker-player.md): one LZ4
# block per frame.
lz4_flex = { version = "0.14", default-features = false, features = ["std", "checked-decode"] }
thiserror = "2"
unicode-segmentation = "1.13"
unicode-bidi = "0.3"
# Combining-mark limit in message text (`display_text`).
unicode-properties = { version = "0.1", default-features = false, features = ["general-category"] }
spellbook = "0.4"
encoding_rs = "0.8"
zeroize = { version = "1", features = ["zeroize_derive"] }
# Passkeys on a USB security key (docs/decisions/passkeys-ceremony.md): CTAP2
# over HID is written in-tree; CBOR and the PIN protocol crypto (P-256 ECDH,
# HKDF and HMAC with SHA-256, AES-256-CBC) come from RustCrypto. No OpenSSL.
# sha2 0.11 is the digest generation hmac 0.13, hkdf 0.13 and pbkdf2 0.13 use.
ciborium = "0.2"
p256 = { version = "0.14", default-features = false, features = ["arithmetic", "ecdh"] }
aes = "0.9"
cbc = "0.2"
hmac = "0.13"
hkdf = "0.13"
# Passkeys from a phone (hybrid / caBLE v2, docs/decisions/passkeys-hybrid.md):
# the tunnel's AES-256-GCM, and its websocket. tungstenite brings no TLS of its
# own; it runs over a rustls stream with the ring provider and the webpki
# roots, the same stack ureq already links. No OpenSSL.
aes-gcm = { version = "0.11", default-features = false, features = ["aes", "alloc"] }
tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "1"
interprocess = { version = "2", default-features = false }
# Interface language packs (docs/decisions/language-packs.md): lock-free reads
# of the current strings from render code, CLDR plural rules (ICU4X,
# Unicode-3.0) and GPUI's string type without GPUI itself.
arc-swap = "1"
icu_plurals = { version = "2", default-features = false, features = ["compiled_data"] }
icu_locale_core = { version = "2", default-features = false }
# Language box search folds diacritics (NFD), like tdesktop's search words.
icu_normalizer = { version = "2", default-features = false, features = ["compiled_data"] }
# `sync`: plural rules live in the shared string snapshot (Send + Sync).
icu_provider = { version = "2", default-features = false, features = ["sync"] }
gpui_shared_string = { package = "gpui-pre-shared-string", version = "=0.3.10" }

[dependencies.gpui-kit]
version = "=0.8.1"
optional = true
default-features = false
features = ["component", "assets", "syntect"]

# The input engine under gpui-kit (patched below), named directly for the
# composer's formatting spans (docs/decisions/codex-composer-input.md).
[dependencies.gpui-base]
version = "=0.8.1"
optional = true

# tray-icon is GTK/libappindicator on Linux and needs gtk::init plus a GTK main
# loop, neither of which a GPUI process has; Linux uses ksni (pure-Rust
# StatusNotifierItem over D-Bus, same zbus/async-io stack as GPUI) instead.
[target.'cfg(not(target_os = "linux"))'.dependencies]
tray-icon = { version = "0.26", optional = true, default-features = false }

[target.'cfg(target_os = "linux")'.dependencies]
ksni = { version = "0.3", optional = true, default-features = false, features = ["async-io"] }
# MPRIS (org.mpris.MediaPlayer2) on the session bus; same zbus GPUI and ksni already link.
zbus = { version = "5", optional = true }
# Passkeys from a phone: the BlueZ scan (src/webauthn/hybrid/ble_linux.rs)
# waits on D-Bus signals with a timeout. Both already in the lockfile via zbus.
async-io = { version = "2", optional = true }
futures-lite = { version = "2", optional = true }
# System-wide push-to-talk (docs/decisions/codex-ptt-global.md): the X11 RECORD
# extension. Same x11rb 0.13 GPUI already links; only the `record` feature is new. `screensaver` (MIT-SCREEN-SAVER QueryInfo)
# gives OS idle time on X11 sessions (src/passcode/idle.rs).
x11rb = { version = "0.13", default-features = false, features = ["record", "composite", "randr", "screensaver"] }
# Screen sharing (src/calls/capture/screen_linux.rs): the screen cast portal on
# Wayland (async-io and futures-lite are declared above);
# libpipewire is loaded at run time (pipewire_dl.rs), so no build dependency.
ashpd = { version = "0.13", optional = true, default-features = false, features = ["async-io", "screencast"] }
# A GPU lost for good ends in the launch failure alert (src/ui/startup_failure.rs):
# the renderer GPUI's Linux backend already links reports it.
gpui_wgpu = { package = "gpui-pre-wgpu", version = "=0.3.10", optional = true, default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
# Security keys over IOKit HID (src/webauthn/ctap2/hid_macos.rs).
core-foundation-sys = "0.8"
# Code-signature checks of a staged update (src/update_install/macos).
core-foundation = "0.10"
security-framework = "3"
security-framework-sys = "2"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["NSAlert", "NSHapticFeedback", "NSMenu", "NSView", "NSWindow", "NSScreen", "NSPasteboard", "NSPasteboardItem", "NSImage", "NSFont", "NSStringDrawing", "NSAttributedString", "NSImageRep", "NSBitmapImageRep", "NSGraphics", "NSSpellChecker", "NSApplication", "NSDockTile", "NSStatusItem", "NSStatusBarButton", "NSButton", "NSControl", "NSResponder", "NSAppearance", "NSBezierPath", "NSColor", "NSColorSpace", "NSGraphicsContext", "NSWorkspace", "NSTouchBar", "NSTouchBarItem", "NSCustomTouchBarItem", "NSPopoverTouchBarItem", "NSScrubber", "NSScrubberItemView", "NSScrubberLayout", "NSSegmentedControl", "NSSlider", "NSImageView", "NSScrollView", "NSClipView", "NSGestureRecognizer", "NSPressGestureRecognizer", "NSTouch", "NSEvent", "NSTextField", "NSUserInterfaceItemIdentification", "NSCell", "NSText", "NSParagraphStyle", "NSTextAttachment", "block2"], optional = true }
# Native video playback (AVPlayer → CVPixelBuffer → GPUI surface).
objc2 = { version = "0.6", optional = true }
objc2-foundation = { version = "0.3.2", optional = true, default-features = false, features = ["std", "NSProcessInfo", "NSString", "NSURL", "NSDictionary", "NSValue", "NSObject", "NSError", "NSArray", "NSData", "NSGeometry", "NSAttributedString", "NSRange", "NSLocale", "NSTimer", "NSDate", "NSSet", "NSIndexSet", "NSEnumerator", "NSBundle", "NSTextCheckingResult", "NSOrthography", "block2"] }
objc2-av-foundation = { version = "0.3.2", optional = true, default-features = false, features = ["std", "objc2-core-media", "objc2-core-video", "objc2-core-graphics", "AVPlayer", "AVPlayerItem", "AVPlayerItemOutput", "AVPlayerItemTrack", "AVAsset", "AVAssetTrack", "AVAssetImageGenerator", "AVAudioProcessingSettings", "AVTime", "AVMediaFormat", "AVCaptureDevice", "block2"] }
block2 = { version = "0.6", optional = true }
objc2-core-media = { version = "0.3.2", optional = true, default-features = false, features = ["std", "CMTime", "CMTimeRange", "CMSampleBuffer", "objc2-core-video"] }
# GPUI's `surface` takes a `CFRetained<CVPixelBuffer>`; `CVHostTime` paces
# AVPlayer pulls on Mach host ticks.
objc2-core-video = { version = "0.3.2", optional = true, default-features = false, features = ["std", "objc2", "CVPixelBuffer", "CVPixelBufferPool", "CVImageBuffer", "CVBuffer", "CVReturn", "CVBase", "CVHostTime", "bitflags"] }
# Screen sharing in calls (src/calls/capture/screen_mac.rs): sources,
# thumbnails and the NV12 stream from ScreenCaptureKit.
objc2-screen-capture-kit = { version = "0.3.2", optional = true, default-features = false, features = ["std", "SCShareableContent", "SCStream", "SCScreenshotManager", "SCError", "block2", "dispatch2", "libc", "objc2-core-media", "objc2-core-graphics", "objc2-core-foundation"] }
dispatch2 = { version = "0.3.1", optional = true, default-features = false, features = ["std", "objc2"] }
# Image files (HEIC, AVIF, JPEG XL and the rest) decoded and colour-managed
# with ImageIO (src/ui/image_decode/macos.rs).
objc2-image-io = { version = "0.3.2", optional = true, default-features = false, features = ["std", "CGImageSource", "CGImageProperties", "objc2-core-graphics"] }
objc2-core-graphics = { version = "0.3.2", optional = true, default-features = false, features = ["std", "CGImage", "CGContext", "CGBitmapContext", "CGColorSpace", "CGGeometry", "CGWindow", "CGDirectDisplay"] }
objc2-core-foundation = { version = "0.3.2", optional = true, default-features = false, features = ["std", "objc2", "CFData", "CFDictionary", "CFNumber", "CFString", "CFBase", "CFCGTypes", "CFURL"] }
# Passkeys from a phone: the caBLE advertisements over CoreBluetooth
# (src/webauthn/hybrid/ble_macos.rs).
objc2-core-bluetooth = { version = "0.3.2", optional = true, default-features = false, features = ["std", "CBAdvertisementData", "CBCentralManager", "CBCentralManagerConstants", "CBManager", "CBPeer", "CBPeripheral", "CBUUID", "dispatch2"] }
# Badge authorization (the Dock draws badges only for apps allowed to badge).
objc2-user-notifications = { version = "0.3", optional = true }
# Send Location's "where am I" and the pin's address (src/ui/location_picker/geolocation/macos.rs).
objc2-core-location = { version = "0.3.2", optional = true, default-features = false, features = ["std", "block2", "CLLocationManager", "CLLocationManagerDelegate", "CLLocation", "CLGeocoder", "CLPlacemark", "CLError"] }
# OS notifications: the inline reply field and the sender picture ride beside
# GPUI's `SystemNotification` through the Quill patch in the vendored platform
# crate (`notification_extras`, docs/decisions/codex-notify-native.md). Same
# crate GPUI already links.
gpui_macos = { package = "gpui-pre-macos", version = "=0.3.10", optional = true, default-features = false }
# Lock-screen / media-key Now Playing (MPNowPlayingInfoCenter, MPRemoteCommandCenter).
objc2-media-player = { version = "0.3.2", optional = true, default-features = false, features = ["std", "MPNowPlayingInfoCenter", "MPRemoteCommandCenter", "MPRemoteCommand", "MPMediaItem", "MPRemoteCommandEvent", "block2"] }

[dev-dependencies]
futures-lite = "2"
pretty_assertions = "1"
unicode-bidi-mirroring = "0.4"
ureq = { version = "3.5", default-features = false }
# Turns on the test-only branches of the library (private media-cache root) for
# every test target, including the binary's tests.
quill = { path = ".", default-features = false, features = ["test-support"] }

[[bin]]
name = "quill"
path = "src/main.rs"

# The console-subsystem front for `quill agent` on Windows: quill.exe is a GUI
# program there, so a terminal neither waits for it nor gets its exit code.
# Uses only std; see src/cli_shim.rs.
[[bin]]
name = "quill-cli"
path = "src/cli_shim.rs"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"

# Local iteration: keep only line tables in the top crate and strip debuginfo
# from external dependencies entirely (workspace path deps like
# quill-calls-sys keep line tables — Cargo ignores package overrides for
# workspace members). Release profile is untouched; use
# `--profile debugging` (full debuginfo) when real debug info is needed.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.debugging]
inherits = "dev"
debug = true

[build-dependencies]
# Compiles the vendored ThorVG sticker renderer (build.rs, third_party/thorvg).
cc = { version = "1", features = ["parallel"] }

[target.'cfg(windows)'.build-dependencies]
# Application icon resource (build.rs).
embed-resource = "3"

[target.'cfg(windows)'.dependencies]
# Wide strings for the agent pipe's security descriptor (src/pipe_security.rs).
widestring = "1"
# Local time zone offsets; secret chats kept out of screen capture.
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Globalization", "Win32_Graphics_Dwm", "Win32_NetworkManagement_IpHelper", "Win32_Networking_WindowsWebServices", "Win32_Security", "Win32_Security_Authorization", "Win32_Security_Cryptography", "Win32_Storage_FileSystem", "Win32_System_Console", "Win32_System_Diagnostics_Debug", "Win32_System_IO", "Win32_System_JobObjects", "Win32_System_Kernel", "Win32_System_LibraryLoader", "Win32_System_Threading", "Win32_System_Power", "Win32_System_Registry","Win32_System_Time", "Win32_System_SystemInformation", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
# ISpellChecker (Windows 8+ Spell Checking API), as tdesktop's spellcheck_win.cpp.
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Globalization", "Win32_Storage_EnhancedStorage", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Variant", "Win32_UI_Shell", "Win32_UI_Shell_PropertiesSystem", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Imaging", "Media", "Media_Playback", "Foundation",
    # Screen sharing (src/calls/capture/screen_win.rs): Windows.Graphics.Capture.
    "Foundation_Metadata", "Graphics", "Graphics_Capture", "Graphics_DirectX", "Graphics_DirectX_Direct3D11",
    "Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D11", "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi", "Win32_Graphics_Dwm", "Win32_System_WinRT", "Win32_System_WinRT_Direct3D11",
    "Win32_System_WinRT_Graphics_Capture",
    # Send Location (src/ui/location_picker/geolocation/windows.rs).
    "Devices_Geolocation"] }
# OS notifications: the inline reply field and the sender picture ride beside
# GPUI's `SystemNotification` through the Quill patch in the vendored platform
# crate (`notification_extras`, docs/decisions/codex-notify-native.md). Same
# crate GPUI already links.
gpui_windows = { package = "gpui-pre-windows", version = "=0.3.10", optional = true, default-features = false }

# Right-to-left composer typing (docs/decisions/codex-rtl-composer.md): gpui-base
# 0.8.0 with a bidi-aware input engine. Each patched crate's QUILL-CHANGES.md names
# the commit holding its pristine registry copy; a diff against it isolates the patch.
[patch.crates-io]
gpui-base = { path = "third_party/gpui-base" }
# gpui-component 0.8.1. Folder tabs: the TabBar indicator jumps instead of
# springing when only the selected tab bounds change
# (docs/decisions/folder-tabs-no-badge-spring.md).
gpui-component = { path = "third_party/gpui-component" }
# Idle CPU (docs/decisions/codex-idle-cpu.md): gpui-pre-macos 0.3.10 with a
# display link that stops while the window has nothing to draw.
gpui-pre-macos = { path = "third_party/gpui-pre-macos" }
# Idle frames on X11 and Windows (docs/decisions/codex-idle-frames-x11-windows.md):
# gpui-pre-linux and gpui-pre-windows 0.3.10, whose per-frame wake pauses while
# the window has nothing to draw.
gpui-pre-linux = { path = "third_party/gpui-pre-linux" }
gpui-pre-windows = { path = "third_party/gpui-pre-windows" }
# Colour emoji on Linux (docs/decisions/linux-titlebar-emoji.md): gpui-pre-wgpu
# 0.3.10 shaping emoji graphemes with Noto Color Emoji, so flags and keycaps are
# not drawn with FreeSans' boxed letters.
gpui-pre-wgpu = { path = "third_party/gpui-pre-wgpu" }
gpui-pre-apple = { path = "third_party/gpui-pre-apple" }
gpui-pre = { path = "third_party/gpui-pre" }
# Opus voice-note CPU (docs/decisions/opus-decode-cpu.md): opus-decoder 0.1.1
# with the CELT inverse MDCT on a mixed-radix FFT instead of a direct DFT.
opus-decoder = { path = "third_party/opus-decoder" }
# Linux idle wakeups (sweep bundle B13, N49): blocking 1.7.0, whose idle pool
# threads woke every 500 ms forever instead of exiting.
blocking = { path = "third_party/blocking" }
