[workspace]
members = [".", "crates/ntgcalls-sys"]
resolver = "2"

[package]
name = "quill"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
license = "MIT"
description = "Independent GPUI + TDLib Telegram desktop client (working name Quill)"
repository = "https://github.com/shinycake/quill"
publish = false

[features]
default = ["ui"]
ui = ["dep:gpui-kit", "dep:image", "dep:smallvec", "dep:qrcode", "dep:tray-icon", "dep:ureq"]

[dependencies]
base64 = "0.22"
directories = "6"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"], optional = true }
libloading = "0.8"
libc = "0.2"
ntgcalls-sys = { path = "crates/ntgcalls-sys" }
qrcode = { version = "0.14", optional = true, default-features = false, features = ["image"] }
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
semver = "1"
ureq = { version = "3.4", default-features = false, features = ["rustls"], optional = true }
sha2 = "0.10"
smallvec = { version = "1", optional = true }
thiserror = "2"
tray-icon = { version = "0.21", optional = true, default-features = false }
unicode-segmentation = "1.13"
zeroize = { version = "1", features = ["zeroize_derive"] }

[dependencies.gpui-kit]
version = "=0.6.1"
optional = true
default-features = false
features = ["component", "assets"]

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3"

[dev-dependencies]
pretty_assertions = "1"

[[bin]]
name = "quill"
path = "src/main.rs"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"

# Local iteration: keep only line tables in the top crate and strip debuginfo
# from external dependencies entirely (workspace path deps like
# ntgcalls-sys keep line tables — Cargo ignores package overrides for
# workspace members). Release profile is untouched; use
# `--profile debugging` (full debuginfo) when real debug info is needed.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.debugging]
inherits = "dev"
debug = true
