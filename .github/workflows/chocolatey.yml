name: chocolatey
# The Chocolatey package (packaging/chocolatey/): built from a published
# release's setup.exe, installed, run and uninstalled on a Windows runner,
# then pushed to community.chocolatey.org when CHOCO_API_KEY is set (a
# stable release, or a manual run with push=true). Chocolatey moderates each
# version before it is listed. docs/decisions/distribution-channels.md
on:
  # Sent by release-published.yml, so this runs main's code, never an old
  # tag's (the `publish` environment takes main only).
  repository_dispatch:
    types: [release-published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (vYEAR.MONTHDAY.COMMITS); empty for the latest release'
        required: false
        default: ''
      push:
        description: 'Push the package to community.chocolatey.org'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  # Publishing trusts only the newest release whose files all match their
  # signatures (scripts/release_verify.py): anyone with write access can
  # replace an unsigned release's files or recreate an old release.
  verify:
    if: ${{ (github.event_name == 'repository_dispatch' && !github.event.client_payload.prerelease) || inputs.push }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: the release is the newest signed one
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.client_payload.tag || inputs.tag }}
        run: |
          newest="$(python3 scripts/release_verify.py pick | python3 -c 'import json, sys; r = json.load(sys.stdin); print(r["tag_name"] if r else "")')"
          [ -n "$TAG" ] || { echo "::error::name the release tag to publish"; exit 1; }
          [ -n "$newest" ] && [ "$newest" = "$TAG" ] || { echo "::error::$TAG is not the newest signed release (${newest:-none}); not publishing"; exit 1; }
          echo "publishing $TAG"

  chocolatey:
    needs: verify
    if: ${{ !failure() && !cancelled() && (github.event_name != 'repository_dispatch' || !github.event.client_payload.prerelease) }}
    # Pushing uses CHOCO_API_KEY, which lives in the `publish` environment (main
    # and v* tags only); test runs get no environment and push nothing.
    environment: ${{ (github.event_name == 'repository_dispatch' || inputs.push) && 'publish' || '' }}
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: version
        id: v
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.client_payload.tag || inputs.tag }}
        run: |
          [ -n "$TAG" ] || TAG="$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
      - name: build the package
        shell: pwsh
        run: |
          python packaging/chocolatey/make-package.py '${{ steps.v.outputs.version }}' "$env:RUNNER_TEMP\choco"
          if ($LASTEXITCODE -ne 0) { throw 'make-package failed' }
          Push-Location "$env:RUNNER_TEMP\choco"
          choco pack --limit-output
          if ($LASTEXITCODE -ne 0) { throw 'choco pack failed' }
          Pop-Location
      - name: install, run and uninstall
        shell: pwsh
        run: |
          choco install quill --source "$env:RUNNER_TEMP\choco" -y --no-progress
          if ($LASTEXITCODE -ne 0) { throw 'choco install failed' }
          $exe = Join-Path $env:LOCALAPPDATA 'Programs\Quill\quill.exe'
          . scripts/windows-common.ps1
          $v = Invoke-QuillExe $exe @('--version')
          if ($v -ne 'Quill ${{ steps.v.outputs.version }}') { throw "installed --version: $v" }
          choco uninstall quill -y --no-progress
          if ($LASTEXITCODE -ne 0) { throw 'choco uninstall failed' }
          for ($i = 0; $i -lt 20 -and (Test-Path $exe); $i++) { Start-Sleep -Milliseconds 500 }
          if (Test-Path $exe) { throw 'uninstall left quill.exe' }
      - name: push
        if: ${{ github.event_name == 'repository_dispatch' || inputs.push }}
        shell: pwsh
        env:
          CHOCO_API_KEY: ${{ secrets.CHOCO_API_KEY }}
        run: |
          if (-not $env:CHOCO_API_KEY) { Write-Host '::notice::CHOCO_API_KEY is not set: the package was tested but not pushed'; exit 0 }
          $pkg = Get-ChildItem "$env:RUNNER_TEMP\choco\quill.*.nupkg" | Select-Object -First 1
          choco push $pkg.FullName --source https://push.chocolatey.org/ --api-key $env:CHOCO_API_KEY --limit-output
          if ($LASTEXITCODE -ne 0) { throw 'choco push failed' }
