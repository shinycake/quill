name: macos-smoke-fallback
# Hosted-macOS fallback for the macOS compile gate. Used ONLY when Idan's
# M1 Pro self-hosted runner is offline.
# workflow_dispatch ONLY (triggering requires write access) — the merge
# pipeline dispatches it explicitly in that case. There are intentionally no
# pull_request triggers, so this never runs on its own.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Full commit SHA to compile-smoke'
        required: true
        type: string
permissions:
  contents: read
jobs:
  macos-smoke:
    name: macos-ui-build
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7, SHA-pinned
        with:
          ref: ${{ inputs.ref }}
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # SHA-pinned
        with:
          toolchain: 1.99.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2, SHA-pinned
      - name: compile ui
        run: cargo build --features ui --locked
      - name: compile release ui
        run: cargo build --features ui --release --locked
      - name: build bundled TGS renderer
        run: bash scripts/build-rlottie.sh
      - name: package smoke
        run: bash scripts/macos-package-smoke.sh
