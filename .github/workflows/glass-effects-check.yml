# Temporary workflow for the Glass effects switch, removed before the PR:
# ready-showcase with a menu open on Linux (Xvfb, lavapipe Vulkan and llvmpipe GL)
# and Windows (WARP), with the glass shaders compiled on both.
name: glass-effects-check
on:
  push:
    branches: [claude/project-thread-urlqx2]
jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.100.0
      - uses: Swatinem/rust-cache@v2
      - name: apt dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake pkg-config nasm \
            zlib1g-dev libssl-dev libgtk-3-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libwayland-dev libxcb1-dev libx11-xcb-dev libxcb-xkb-dev libfontconfig-dev \
            libfreetype-dev libasound2-dev libvulkan-dev libdbus-1-dev libclang-dev dbus \
            xvfb xauth mesa-vulkan-drivers imagemagick vulkan-tools \
            libegl1 libegl-mesa0 libgl1-mesa-dri mesa-utils
      - name: build UI binary
        run: cargo build --features demo-capture --locked --bin quill
      - name: glass shots
        run: bash .github/glass-shots.sh target/debug/quill "$RUNNER_TEMP/glass"
      - name: upload
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: glass-linux
          path: ${{ runner.temp }}/glass
          retention-days: 7
  windows:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.100.0
      - uses: Swatinem/rust-cache@v2
      - name: glass shaders on WARP (debug, D3DCompileFromFile)
        run: cargo test -p gpui-pre-windows --lib --locked -- shared_shader_tests --nocapture
      - name: build UI binary
        run: cargo build --features demo-capture --locked --bin quill
      - name: glass shots
        shell: pwsh
        run: .github/glass-shots.ps1 target/debug/quill.exe "$env:RUNNER_TEMP/glass"
      - name: release shaders (fxc in build.rs)
        run: cargo check -p gpui-pre-windows --release --locked
      - name: upload
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: glass-windows
          path: ${{ runner.temp }}/glass
          retention-days: 7
