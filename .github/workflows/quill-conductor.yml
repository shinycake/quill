# Quill Conductor — GitHub-native control loop (workflow-redesign.md §1.1, §7 step 3).
#
# MIGRATION STEP 3: installed DISABLED FOR MUTATION. The pinned control issue
# (labeled `quill-control`) sets `mode: shadow`; in shadow mode this workflow
# only rebuilds and publishes the read-only projection — it never writes to
# branches, PRs, issues, checks, or merges. Active-mode logic lands in later
# migration steps (9+).
#
# ponytail: the whole shadow reconcile is one script
# (.github/scripts/quill-shadow-projection.sh); this file is just triggers.
name: quill-conductor

on:
  pull_request:
    types: [opened, synchronize, reopened, closed, ready_for_review, converted_to_draft]
  workflow_run:
    workflows: ["ci"]
    types: [completed]
  issues:
    types: [opened, edited, labeled, unlabeled, closed, reopened]
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: quill-conductor
  cancel-in-progress: false

permissions:
  contents: read
  issues: read
  pull-requests: read
  actions: read

jobs:
  reconcile:
    name: shadow-reconcile
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            .github/scripts
            scripts/parity_pct.sh
          sparse-checkout-cone-mode: false
      - name: Shadow reconcile (read-only)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          chmod +x .github/scripts/quill-shadow-projection.sh
          OUT=projection.json bash .github/scripts/quill-shadow-projection.sh
      - name: Upload projection
        uses: actions/upload-artifact@v4
        with:
          name: shadow-projection-${{ github.run_id }}
          path: projection.json
          retention-days: 7
