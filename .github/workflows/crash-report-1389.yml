name: crash-report-1389
# Temporary: the native crash report tests on Windows before merge. Removed
# before the fix merges.
on:
  push:
    branches: [claude/project-thread-mib9x2]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.1
      - uses: Swatinem/rust-cache@v2
      - name: native crash tests
        run: cargo test --no-default-features --locked --lib native_crash -- --nocapture
