name: package-macos
# Reusable: Quill.app for macOS 14+ on Apple Silicon, built on a GitHub-hosted
# arm64 runner (never the personal self-hosted Mac). TDLib is built from source
# (cached), libquill_calls (the call library) comes from quill-calls.yml, which
# the calls job runs first, with the FFmpeg it links (cached),
# and OpenSSL, built here for the deployment target, is bundled by
# scripts/macos-package-smoke.sh.
# Signed with the identity in MACOS_SIGNING_P12 (Apple Development or Developer
# ID Application), ad-hoc otherwise. The certificate keeps the keychain
# approval for the database key across updates (docs/decisions/macos-release-signing.md).
# Release builds signed with Developer ID are notarized and stapled when the
# MACOS_NOTARY_* App Store Connect API key is set (docs/decisions/macos-developer-id.md).
on:
  workflow_call:
    inputs:
      version:
        description: 'Release version (the date, YYYY.M.D) stamped into the binary; empty for CI builds'
        type: string
        default: ''
      embed_credentials:
        description: 'Compile the Telegram api_id/api_hash secrets into the binary'
        type: boolean
        default: false
    secrets:
      TELEGRAM_API_ID:
        required: false
      TELEGRAM_API_HASH:
        required: false
      MACOS_SIGNING_P12:
        description: 'Base64 PKCS#12 holding the Apple Development or Developer ID Application identity'
        required: false
      MACOS_SIGNING_P12_PASSWORD:
        required: false
      MACOS_NOTARY_KEY:
        description: 'Base64 App Store Connect API key (.p8) for notarytool'
        required: false
      MACOS_NOTARY_KEY_ID:
        required: false
      MACOS_NOTARY_ISSUER_ID:
        required: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # Matches LSMinimumSystemVersion in the Info.plist; CMake and rustc read it.
  MACOSX_DEPLOYMENT_TARGET: '14.0'

jobs:
  # The call library this package ships (docs/decisions/tgcalls-engine.md).
  calls:
    name: calls
    uses: ./.github/workflows/quill-calls.yml
    with:
      targets: macos-arm64
      mode: build

  macos-package:
    name: macos-package
    needs: calls
    # arm64. The deployment target above, not the runner, sets the oldest
    # macOS Quill runs on; check-bundle-macho.sh fails on any library that
    # needs a newer one.
    runs-on: macos-15
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.100.0
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ !inputs.embed_credentials }}
      - name: build tools
        run: |
          brew list gperf >/dev/null 2>&1 || brew install gperf
      - name: restore OpenSSL build
        id: openssl-cache
        uses: actions/cache/restore@v6
        with:
          path: native/openssl/prefix
          key: openssl-macos-${{ runner.arch }}-${{ hashFiles('scripts/build-openssl.sh') }}
      - name: build OpenSSL
        if: steps.openssl-cache.outputs.cache-hit != 'true'
        run: bash scripts/build-openssl.sh
      - name: save OpenSSL build
        if: steps.openssl-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: native/openssl/prefix
          key: openssl-macos-${{ runner.arch }}-${{ hashFiles('scripts/build-openssl.sh') }}
      - name: use the built OpenSSL
        run: echo "OPENSSL_ROOT_DIR=$PWD/native/openssl/prefix" >> "$GITHUB_ENV"
      - name: restore TDLib build
        id: tdlib-cache
        uses: actions/cache/restore@v6
        with:
          path: native/prefix
          key: tdlib-macos-${{ runner.arch }}-${{ hashFiles('src/pins.rs', 'scripts/build-tdlib.sh', 'scripts/build-openssl.sh', 'native/patches/*') }}
      - name: build TDLib
        if: steps.tdlib-cache.outputs.cache-hit != 'true'
        env:
          TDLIB_BUILD_TARGET: tdjson tdjson_static
          # The hosted runner has 3 cores and 7 GB; TDLib's generated API
          # files need several GB per compiler, and one job per core made
          # clang crash out of memory (Abort trap: 6) on a cold build.
          JOBS: '2'
        run: bash scripts/build-tdlib.sh
      - name: save TDLib build
        if: steps.tdlib-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: native/prefix
          key: tdlib-macos-${{ runner.arch }}-${{ hashFiles('src/pins.rs', 'scripts/build-tdlib.sh', 'scripts/build-openssl.sh', 'native/patches/*') }}
      # libquill_calls links FFmpeg dynamically; the app ships the build it
      # was linked against (same cache key as quill-calls.yml).
      - name: restore FFmpeg build
        id: ffmpeg-cache
        uses: actions/cache/restore@v6
        with:
          path: vendor/ffmpeg/prefix
          key: ffmpeg-macos-${{ runner.arch }}-${{ hashFiles('scripts/build-ffmpeg.sh', 'native/quillvideo/*') }}
      - name: build FFmpeg
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        run: bash scripts/build-ffmpeg.sh
      - name: save FFmpeg build
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: vendor/ffmpeg/prefix
          key: ffmpeg-macos-${{ runner.arch }}-${{ hashFiles('scripts/build-ffmpeg.sh', 'native/quillvideo/*') }}
      - name: download libquill_calls
        uses: actions/download-artifact@v8
        with:
          name: quill-calls-macos-arm64
          path: vendor/quill-calls
      - name: Metal toolchain
        run: bash scripts/ensure-metal-toolchain.sh
      # The secrets reach only this step, as compile-time env read by
      # option_env! (src/credentials.rs).
      - name: build release ui
        env:
          QUILL_RELEASE_VERSION: ${{ inputs.version }}
          QUILL_BUILD_TELEGRAM_API_ID: ${{ inputs.embed_credentials && secrets.TELEGRAM_API_ID || '' }}
          QUILL_BUILD_TELEGRAM_API_HASH: ${{ inputs.embed_credentials && secrets.TELEGRAM_API_HASH || '' }}
          QUILL_REQUIRE_METALLIB: '1'
        run: cargo build --release --features ui --locked
      - name: build mini-app helper
        run: cargo build --release --locked -p quill-webview
      # A throwaway keychain holds the identity for codesign; the step only
      # exports the certificate's SHA-1, never the key.
      - name: import signing identity
        env:
          P12: ${{ secrets.MACOS_SIGNING_P12 }}
          P12_PASSWORD: ${{ secrets.MACOS_SIGNING_P12_PASSWORD }}
          RELEASE_BUILD: ${{ inputs.embed_credentials }}
        run: |
          if [ -z "$P12" ]; then
            if [ "$RELEASE_BUILD" = true ]; then
              echo "::warning::MACOS_SIGNING_P12 is not set: Quill.app is ad-hoc signed and every update asks for the keychain password"
            fi
            exit 0
          fi
          kc="$RUNNER_TEMP/signing.keychain-db"
          kcpass="$(uuidgen)"
          security create-keychain -p "$kcpass" "$kc"
          security set-keychain-settings -lut 21600 "$kc"
          security unlock-keychain -p "$kcpass" "$kc"
          printf '%s' "$P12" | base64 --decode > "$RUNNER_TEMP/signing.p12"
          security import "$RUNNER_TEMP/signing.p12" -k "$kc" -P "$P12_PASSWORD" -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/signing.p12"
          # The intermediates that issue Apple Development and Developer ID
          # certificates, so the identity validates and codesign embeds the
          # whole chain.
          for ca in AppleWWDRCAG3 DeveloperIDG2CA; do
            curl -fsSL "https://www.apple.com/certificateauthority/$ca.cer" -o "$RUNNER_TEMP/$ca.cer"
            security import "$RUNNER_TEMP/$ca.cer" -k "$kc" || true
          done
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$kcpass" "$kc" >/dev/null
          # shellcheck disable=SC2046 # keychain paths on the runner have no spaces
          security list-keychains -d user -s "$kc" $(security list-keychains -d user | tr -d '"')
          identity="$(security find-identity -v -p codesigning "$kc" | awk '$1 ~ /^[0-9]+\)$/ {print $2; exit}')"
          [ -n "$identity" ] || { echo "::error::MACOS_SIGNING_P12 holds no valid code signing identity"; exit 1; }
          echo "QUILL_CODESIGN_IDENTITY=$identity" >> "$GITHUB_ENV"
      - name: package Quill.app
        env:
          # The hosted VM's Vision framework may not decode QR codes; the
          # self-test stays a hard failure on real Macs (quill-ui-build.yml).
          QUILL_QR_SELF_TEST: warn
        run: |
          QUILL_BIN="$PWD/target/release/quill" QUILL_TDJSON_PATH="$PWD/native/prefix/lib/libtdjson.dylib" \
            bash scripts/macos-package-smoke.sh
          for lib in libtdjson.dylib libquill_calls.dylib libssl.3.dylib libcrypto.3.dylib; do
            test -f "dist/Quill.app/Contents/Frameworks/$lib" || { echo "missing Frameworks/$lib" >&2; exit 1; }
          done
          ls dist/Quill.app/Contents/Frameworks/libavcodec.*.dylib
          # The call library loads from the bundle alone: FFmpeg and OpenSSL
          # through its @loader_path rpath, nothing from Homebrew or the prefix.
          env -u DYLD_LIBRARY_PATH python3 - dist/Quill.app/Contents/Frameworks/libquill_calls.dylib <<'EOF'
          import ctypes, sys
          lib = ctypes.CDLL(sys.argv[1])
          lib.qc_max_layer.restype = ctypes.c_int32
          assert lib.qc_max_layer() >= 92, "libquill_calls did not load"
          print("libquill_calls loads from the bundle, max layer", lib.qc_max_layer())
          EOF
          codesign --verify --deep --strict --verbose=2 dist/Quill.app
          if [ -n "${QUILL_CODESIGN_IDENTITY:-}" ]; then
            codesign -dv dist/Quill.app 2>&1 | grep -E '^TeamIdentifier=[A-Z0-9]{10}$' \
              || { echo "::error::Quill.app is not signed by the identity's team" >&2; exit 1; }
          fi
      # Apple's notary service scans the signed bundle; the ticket is stapled
      # so Gatekeeper opens it offline. Only Developer ID release builds.
      - name: notarize
        env:
          NOTARY_KEY: ${{ secrets.MACOS_NOTARY_KEY }}
          NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
          RELEASE_BUILD: ${{ inputs.embed_credentials }}
        run: |
          [ "$RELEASE_BUILD" = true ] || exit 0
          if ! codesign -dvv dist/Quill.app 2>&1 | grep -q '^Authority=Developer ID Application: '; then
            echo "::warning::Quill.app is not signed with a Developer ID Application identity: not notarized"
            exit 0
          fi
          if [ -z "$NOTARY_KEY" ] || [ -z "$NOTARY_KEY_ID" ] || [ -z "$NOTARY_ISSUER_ID" ]; then
            echo "::error::Quill.app is signed with Developer ID but the MACOS_NOTARY_* secrets are not set"
            exit 1
          fi
          ditto -c -k --keepParent dist/Quill.app "$RUNNER_TEMP/notarize.zip"
          bash scripts/macos-notarize.sh "$RUNNER_TEMP/notarize.zip"
          echo "QUILL_NOTARIZE=1" >> "$GITHUB_ENV"
          bash scripts/macos-staple.sh dist/Quill.app
          spctl --assess --type execute --verbose=4 dist/Quill.app
      - name: run from the bundle
        env:
          WANT_EMBED: ${{ inputs.embed_credentials && secrets.TELEGRAM_API_ID != '' && secrets.TELEGRAM_API_HASH != '' }}
        run: |
          exe=dist/Quill.app/Contents/MacOS/quill
          "$exe" --version
          test "$("$exe" --build-info)" = ui
          test "$("$exe" --release-asset-name)" = quill-macos-aarch64
          got="$("$exe" --embedded-credentials)"
          want=none; [ "$WANT_EMBED" = true ] && want=embedded
          echo "embedded credentials: $got"
          test "$got" = "$want"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' dist/Quill.app/Contents/Info.plist
      - name: zip
        run: |
          mkdir -p dist/macos
          # ditto keeps the code signature, symlinks and extended attributes.
          ditto -c -k --sequesterRsrc --keepParent dist/Quill.app dist/macos/quill-macos-aarch64.zip
          (cd dist/macos && shasum -a 256 quill-macos-aarch64.zip > quill-macos-aarch64.zip.sha256)
          du -h dist/macos/quill-macos-aarch64.zip
      # The drag-to-Applications disk image the website offers to Mac users
      # (the zip stays: the in-app updater and the install script use it).
      # Built from the stapled app, then signed, notarized and stapled itself,
      # so Gatekeeper opens it offline. docs/decisions/distribution-channels.md
      - name: disk image
        env:
          NOTARY_KEY: ${{ secrets.MACOS_NOTARY_KEY }}
          NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
        run: |
          python3 -m venv "$RUNNER_TEMP/dmgbuild"
          "$RUNNER_TEMP/dmgbuild/bin/pip" install --quiet dmgbuild==1.6.7
          dmg=dist/macos/quill-macos-aarch64.dmg
          DMGBUILD="$RUNNER_TEMP/dmgbuild/bin/dmgbuild" bash scripts/macos-dmg.sh dist/Quill.app "$dmg"
          if [ "${QUILL_NOTARIZE:-}" = 1 ]; then
            bash scripts/macos-notarize.sh "$dmg"
            bash scripts/macos-staple.sh "$dmg"
            spctl --assess --type open --context context:primary-signature --verbose=4 "$dmg"
          fi
          (cd dist/macos && shasum -a 256 quill-macos-aarch64.dmg > quill-macos-aarch64.dmg.sha256)
          # The image holds the same app and an Applications link, laid out.
          mnt="$(mktemp -d)"
          hdiutil attach -nobrowse -readonly -mountpoint "$mnt" "$dmg" >/dev/null
          test -L "$mnt/Applications"
          test -f "$mnt/.background.tiff"
          test -f "$mnt/.DS_Store"
          codesign --verify --deep --strict "$mnt/Quill.app"
          "$mnt/Quill.app/Contents/MacOS/quill" --version
          hdiutil detach "$mnt" >/dev/null
      - name: smoke the extracted zip
        run: |
          mkdir -p "$RUNNER_TEMP/extract"
          ditto -x -k dist/macos/quill-macos-aarch64.zip "$RUNNER_TEMP/extract"
          codesign --verify --deep --strict "$RUNNER_TEMP/extract/Quill.app"
          bash scripts/check-bundle-macho.sh "$RUNNER_TEMP/extract/Quill.app"
          "$RUNNER_TEMP/extract/Quill.app/Contents/MacOS/quill" --version
      # The one-line installer from the README, run on this build's zip.
      # The zip is quarantined first, as a browser would, so the check below
      # proves the installer clears the attribute.
      - name: smoke the installer script
        run: |
          zip="$RUNNER_TEMP/quarantined.zip"
          cp dist/macos/quill-macos-aarch64.zip "$zip"
          xattr -w com.apple.quarantine "0083;$(printf %x "$(date +%s)");Safari;" "$zip"
          QUILL_ZIP_URL="file://$zip" \
          QUILL_SHA256="$(awk '{print $1}' dist/macos/quill-macos-aarch64.zip.sha256)" \
          QUILL_INSTALL_DIR="$RUNNER_TEMP/apps" QUILL_NO_OPEN=1 \
            bash scripts/macos-install.sh
          app="$RUNNER_TEMP/apps/Quill.app"
          xattr -r "$app" > "$RUNNER_TEMP/xattrs.txt"
          if grep -q com.apple.quarantine "$RUNNER_TEMP/xattrs.txt"; then echo "installed app is quarantined" >&2; exit 1; fi
          codesign --verify --deep --strict "$app"
          "$app/Contents/MacOS/quill" --version
      - uses: actions/upload-artifact@v7
        with:
          name: quill-macos-aarch64
          path: |
            dist/macos/quill-macos-aarch64.zip
            dist/macos/quill-macos-aarch64.zip.sha256
            dist/macos/quill-macos-aarch64.dmg
            dist/macos/quill-macos-aarch64.dmg.sha256
          if-no-files-found: error
