name: repro-1389
# Temporary: run a released Quill on hosted macOS 14 and 15 and keep the
# crash reports. Removed before the fix merges.
on:
  push:
    branches: [claude/project-thread-mib9x2]
    paths: ['.github/workflows/repro-1389.yml']
permissions:
  contents: read
jobs:
  run:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - name: download release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sw_vers
          system_profiler SPDisplaysDataType | head -30 || true
          gh release download v2026.1104.5006 -R ${{ github.repository }} -p quill-macos-aarch64.zip
          ditto -x -k quill-macos-aarch64.zip app
          xattr -dr com.apple.quarantine app || true
      - name: run for 25 s
        run: |
          mkdir -p out
          app/Quill.app/Contents/MacOS/quill > out/stdout.txt 2> out/stderr.txt &
          pid=$!
          for i in 3 8 15 24; do
            sleep $(( i - ${last:-0} )); last=$i
            screencapture -x out/shot-$i.png || true
            kill -0 $pid 2>/dev/null && echo "alive at $i s" || echo "gone at $i s"
          done
          kill -0 $pid 2>/dev/null && kill $pid
          wait $pid; echo "exit status $?"
          sleep 5
      - name: collect
        if: always()
        run: |
          cp ~/Library/Logs/DiagnosticReports/*quill* out/ 2>/dev/null || true
          cp -R "$HOME/Library/Application Support/org.shinycake.Quill/logs" out/quill-logs 2>/dev/null || true
          ls -la out out/quill-logs || true
          for f in out/*.ips; do [ -f "$f" ] && head -c 20000 "$f"; done
          tail -50 out/stderr.txt || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: repro-${{ matrix.os }}
          path: out
