# Quill notify — outcome notifications (workflow-redesign.md §1.6).
#
# Notification is a final Conductor phase, not a poller. The Conductor calls
# this reusable workflow after it has CONFIRMED the outcome via the API
# (PR exists with number/head; merge reported with mergedAt+merge SHA).
# Delivery is at-least-once; a duplicate terse ping beats a missed one.
# Notifications never gate work or merging.
#
# MIGRATION STEP 3: installed DISABLED. While the control issue is in
# `mode: shadow` this workflow only LOGS what it would send — it sends
# nothing. Real delivery (chat ping hook) lands with active mode.
name: quill-notify

on:
  workflow_call:
    inputs:
      event:
        description: "pr-open | pr-merge | parity-milestone"
        required: true
        type: string
      pr_number:
        description: "PR number (pr-open, pr-merge)"
        required: false
        type: string
        default: ""
      merge_sha:
        description: "Merge commit SHA (pr-merge)"
        required: false
        type: string
        default: ""
      parity:
        description: "Recomputed parity, e.g. 421/525 (pr-merge, parity-milestone)"
        required: false
        type: string
        default: ""
      main_sha:
        description: "main SHA the parity was computed from"
        required: false
        type: string
        default: ""

permissions: {}

jobs:
  notify:
    name: notify
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Shadow log (no send)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          N="$(gh api "repos/$REPO/issues?labels=quill-control&state=open&per_page=5" \
            --jq '[.[] | select(.title | test("Quill Conductor control"))][0].number')"
          MODE="$(gh api "repos/$REPO/issues/$N" --jq '.body' | grep -m1 '^mode:' | awk '{print $2}')"
          MSG="[quill-notify] event=${{ inputs.event }} pr=${{ inputs.pr_number }} merge=${{ inputs.merge_sha }} parity=${{ inputs.parity }} main=${{ inputs.main_sha }}"
          if [ "$MODE" = "shadow" ]; then
            echo "shadow mode — would send, sending nothing: $MSG"
          else
            echo "::error::active-mode delivery not implemented yet (migration step 9+): $MSG"
            exit 2
          fi
