name: quill-ui-build
# Remote UI compile gate for the Quill build loop.
# SECURITY: this repo is public and the runner below is a personal Mac.
# This workflow is workflow_dispatch ONLY (triggering requires write access) —
# there are intentionally no pull_request / pull_request_target triggers,
# so fork PRs can never execute code on the self-hosted runner.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Full commit SHA to UI-build'
        required: true
        type: string
      run_name:
        description: 'Unique run name for exact run tracking (optional; defaults to ref + run id)'
        required: false
        type: string
run-name: ${{ inputs.run_name || format('{0} (run {1})', inputs.ref, github.run_id) }}
permissions:
  contents: read
jobs:
  ui-build:
    name: macos-ui-build
    runs-on: [self-hosted, macOS, ARM64, quill-ui-build]
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, SHA-pinned
        with:
          ref: ${{ inputs.ref }}
      - name: assert checked-out SHA matches requested ref
        run: |
          BUILT="$(git rev-parse HEAD)"
          if [ "$BUILT" != "${{ inputs.ref }}" ]; then
            echo "ref mismatch: checked out $BUILT, requested ${{ inputs.ref }}" >&2
            exit 1
          fi
      - name: compile ui
        run: cargo build --features ui --locked
      - name: compile release ui
        run: cargo build --features ui --release --locked
      - name: build bundled TGS renderer
        run: bash scripts/build-rlottie.sh
      - name: package smoke
        run: bash scripts/macos-package-smoke.sh
