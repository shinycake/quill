name: quill-ui-build
# Remote UI compile gate for the Quill build loop.
# SECURITY: this repo is public and the runner below is a personal Mac.
# This workflow is workflow_dispatch ONLY (triggering requires write access) —
# there are intentionally no pull_request / pull_request_target triggers,
# so fork PRs can never execute code on the self-hosted runner.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Full commit SHA to UI-build'
        required: true
        type: string
      run_name:
        description: 'Unique run name for exact run tracking (optional; defaults to ref + run id)'
        required: false
        type: string
      package:
        description: 'Also build the release binary and package smoke (slow: LTO)'
        required: false
        default: false
        type: boolean
run-name: ${{ inputs.run_name || format('{0} (run {1})', inputs.ref, github.run_id) }}
permissions:
  contents: read
  statuses: write
jobs:
  ui-build:
    name: macos-ui-build
    runs-on: [self-hosted, macOS, ARM64, quill-ui-build]
    timeout-minutes: 120
    env:
      BUILDER_REF: ${{ inputs.ref }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7, SHA-pinned
        with:
          ref: ${{ inputs.ref }}
          # Keep the runner's cargo cache: the default clean (git clean
          # -ffdx) deleted target/ and vendor/ before every build, so each
          # run compiled everything from scratch.
          clean: false
          # Full history makes fetches into the persistent workspace
          # incremental; a shallow fetch re-downloads the whole tree.
          fetch-depth: 0
      - name: clean workspace (keep build caches)
        run: git clean -ffdx -e target/ -e vendor/
      - name: assert checked-out SHA matches requested ref
        run: |
          if [[ ! "$BUILDER_REF" =~ ^[0-9a-f]{40}$ ]]; then
            echo "ref must be a full commit SHA" >&2
            exit 1
          fi
          BUILT="$(git rev-parse HEAD)"
          if [ "$BUILT" != "$BUILDER_REF" ]; then
            echo "ref mismatch: checked out $BUILT, requested $BUILDER_REF" >&2
            exit 1
          fi
      - name: mark reviewed build pending
        run: >-
          gh api "repos/$GITHUB_REPOSITORY/statuses/$BUILDER_REF"
          -f state=pending -f context=macos-ui-build
          -f description="Reviewed release build on idan-m1pro"
          -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          --silent
      - name: compile ui
        run: cargo build --features ui --locked
      - name: compile release ui
        if: inputs.package
        run: cargo build --features ui --release --locked
      - name: build bundled TGS renderer
        if: inputs.package
        run: bash scripts/build-rlottie.sh
      - name: package smoke
        if: inputs.package
        run: bash scripts/macos-package-smoke.sh
      - name: publish actual build result
        if: always()
        env:
          BUILD_RESULT: ${{ job.status }}
        run: |
          [[ "$BUILDER_REF" =~ ^[0-9a-f]{40}$ ]] || exit 1
          RESULT=failure
          if [ "$BUILD_RESULT" = success ]; then RESULT=success; fi
          gh api "repos/$GITHUB_REPOSITORY/statuses/$BUILDER_REF" \
            -f state="$RESULT" -f context=macos-ui-build \
            -f description="Reviewed release build on idan-m1pro" \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --silent
