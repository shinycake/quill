name: ci

on:
  push:
    branches: [main, "cursor/**"]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  linux:
    name: linux-fmt-clippy-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: fmt
        run: cargo fmt --all -- --check
      - name: clippy (core)
        run: cargo clippy --no-default-features --all-targets --locked -- -D warnings
      - name: tests (core + replay)
        run: cargo test --no-default-features --locked -- --nocapture
      - name: secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          config-path: .gitleaks.toml

  # Not a required check: builds the UI plus native libs and assembles the
  # relocatable Linux package (docs/decisions/codex-linux-package.md).
  linux-package:
    name: linux-package
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
      - uses: Swatinem/rust-cache@v2
      - name: apt dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake gperf git patchelf pkg-config curl unzip file \
            zlib1g-dev libssl-dev libgtk-3-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libwayland-dev libxcb1-dev libx11-xcb-dev libxcb-xkb-dev libfontconfig-dev \
            libfreetype-dev libasound2-dev libvulkan-dev libdbus-1-dev libclang-dev nasm
      - name: restore TDLib build
        id: tdlib-cache
        uses: actions/cache/restore@v4
        with:
          path: native/prefix
          key: tdlib-linux-${{ runner.arch }}-${{ hashFiles('src/pins.rs', 'scripts/build-tdlib.sh', 'native/patches/*') }}
      - name: build TDLib
        if: steps.tdlib-cache.outputs.cache-hit != 'true'
        env:
          TDLIB_BUILD_TARGET: tdjson tdjson_static
        run: bash scripts/build-tdlib.sh
      - name: save TDLib build
        if: steps.tdlib-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: native/prefix
          key: tdlib-linux-${{ runner.arch }}-${{ hashFiles('src/pins.rs', 'scripts/build-tdlib.sh', 'native/patches/*') }}
      - name: restore rlottie build
        id: rlottie-cache
        uses: actions/cache/restore@v4
        with:
          path: vendor/rlottie/prefix
          key: rlottie-linux-${{ runner.arch }}-${{ hashFiles('scripts/build-rlottie.sh') }}
      - name: build rlottie
        if: steps.rlottie-cache.outputs.cache-hit != 'true'
        run: bash scripts/build-rlottie.sh
      - name: save rlottie build
        if: steps.rlottie-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: vendor/rlottie/prefix
          key: rlottie-linux-${{ runner.arch }}-${{ hashFiles('scripts/build-rlottie.sh') }}
      # In-process video (docs/decisions/codex-video-cross-platform.md):
      # FFmpeg (LGPL, shared, decoders only) + the quillvideo shim.
      - name: restore FFmpeg build
        id: ffmpeg-cache
        uses: actions/cache/restore@v4
        with:
          path: vendor/ffmpeg/prefix
          key: ffmpeg-linux-${{ runner.arch }}-${{ hashFiles('scripts/build-ffmpeg.sh', 'native/quillvideo/*') }}
      - name: build FFmpeg
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        run: bash scripts/build-ffmpeg.sh
      - name: save FFmpeg build
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: vendor/ffmpeg/prefix
          key: ffmpeg-linux-${{ runner.arch }}-${{ hashFiles('scripts/build-ffmpeg.sh', 'native/quillvideo/*') }}
      - name: decoder tests against the built FFmpeg
        run: QUILL_VIDEO_LIB="$PWD/vendor/ffmpeg/prefix/lib/libquillvideo.so" cargo test --no-default-features --locked --lib video_decode -- --nocapture
      - name: vendor ntgcalls (checksum pinned)
        run: bash scripts/vendor-ntgcalls.sh
      - name: build release ui
        run: cargo build --release --features ui --locked
      - name: package
        run: bash scripts/linux-package.sh
      - name: check package (ELF dependencies)
        run: bash scripts/check-bundle-elf.sh dist/linux/quill-linux-x86_64
      - name: checker negative test (unbundled OpenSSL must fail)
        run: |
          cp -a dist/linux/quill-linux-x86_64 "$RUNNER_TEMP/neg"
          rm "$RUNNER_TEMP/neg/lib/libssl.so.3"
          if bash scripts/check-bundle-elf.sh "$RUNNER_TEMP/neg"; then echo "checker accepted a package missing libssl" >&2; exit 1; fi
      - name: run from package (no env vars)
        run: |
          env -u LD_LIBRARY_PATH -u QUILL_TDJSON_PATH dist/linux/quill-linux-x86_64/quill --version
          test "$(dist/linux/quill-linux-x86_64/quill --build-info)" = ui
          python3 scripts/check-bundle-dlopen.py dist/linux/quill-linux-x86_64
          env -u LD_LIBRARY_PATH dist/linux/quill-linux-x86_64/quill --video-probe tests/fixtures/clip-h264-aac.mp4
          env -u LD_LIBRARY_PATH dist/linux/quill-linux-x86_64/quill --video-probe tests/fixtures/clip-vp9.webm
      - name: smoke the extracted tarball
        run: |
          mkdir -p "$RUNNER_TEMP/extract"
          tar -C "$RUNNER_TEMP/extract" -xzf dist/linux/quill-linux-x86_64-bundle.tar.gz
          "$RUNNER_TEMP/extract/quill-linux-x86_64/quill" --version
          bash "$RUNNER_TEMP/extract/quill-linux-x86_64/install.sh" "$RUNNER_TEMP/prefix"
          "$RUNNER_TEMP/prefix/bin/quill" --version
          grep -q "^Exec=$RUNNER_TEMP/prefix/opt/quill/quill" "$RUNNER_TEMP/prefix/share/applications/quill.desktop"
      - uses: actions/upload-artifact@v4
        with:
          name: quill-linux-x86_64-bundle
          path: |
            dist/linux/quill-linux-x86_64-bundle.tar.gz
            dist/linux/quill-linux-x86_64-bundle.tar.gz.sha256
          if-no-files-found: error

  # Windows jobs are not required checks (docs/decisions/codex-windows-package.md).
  # windows-build: the UI release binary + core tests. windows-native: TDLib and
  # rlottie from source, ntgcalls prebuilt (cached). windows-package: assemble,
  # check and smoke the zip.
  windows-build:
    name: windows-build
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
      - uses: Swatinem/rust-cache@v2
      - name: build release ui
        run: cargo build --release --features ui --locked
      - name: tests (core + replay)
        run: cargo test --no-default-features --locked -- --nocapture
      - uses: actions/upload-artifact@v4
        with:
          name: quill-windows-exe
          path: target/release/quill.exe
          retention-days: 3
          if-no-files-found: error

  windows-native:
    name: windows-native
    runs-on: windows-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: restore TDLib build
        id: tdlib-cache
        uses: actions/cache/restore@v4
        with:
          path: native/prefix
          key: tdlib-windows-${{ runner.arch }}-${{ hashFiles('src/pins.rs', 'scripts/build-tdlib-windows.ps1', 'scripts/windows-common.ps1', 'native/patches/*') }}
      # Incremental state (sources + objects) so a failure late in the cold
      # build does not cost another 45 minutes. Saved even when the build fails.
      - name: restore TDLib work tree
        if: steps.tdlib-cache.outputs.cache-hit != 'true'
        uses: actions/cache/restore@v4
        with:
          path: |
            native/td
            native/build
          key: tdlib-windows-work-${{ github.run_id }}
          restore-keys: tdlib-windows-work-
      - name: build TDLib
        if: steps.tdlib-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: scripts/build-tdlib-windows.ps1
      - name: save TDLib work tree
        if: always() && steps.tdlib-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            native/td
            native/build
          key: tdlib-windows-work-${{ github.run_id }}
      - name: save TDLib build
        if: steps.tdlib-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: native/prefix
          key: tdlib-windows-${{ runner.arch }}-${{ hashFiles('src/pins.rs', 'scripts/build-tdlib-windows.ps1', 'scripts/windows-common.ps1', 'native/patches/*') }}
      - name: vendor ntgcalls (checksum pinned)
        shell: bash
        run: bash scripts/vendor-ntgcalls.sh
      - uses: actions/upload-artifact@v4
        with:
          name: quill-windows-native
          path: |
            native/prefix/bin/*.dll
            vendor/ntgcalls/lib/Release/ntgcalls.dll
          retention-days: 3
          if-no-files-found: error

  windows-rlottie:
    name: windows-rlottie
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: restore rlottie build
        id: rlottie-cache
        uses: actions/cache/restore@v4
        with:
          path: vendor/rlottie/prefix
          key: rlottie-windows-${{ runner.arch }}-${{ hashFiles('scripts/build-rlottie-windows.ps1', 'scripts/windows-common.ps1') }}
      - name: build rlottie
        if: steps.rlottie-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: scripts/build-rlottie-windows.ps1
      - name: save rlottie build
        if: steps.rlottie-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: vendor/rlottie/prefix
          key: rlottie-windows-${{ runner.arch }}-${{ hashFiles('scripts/build-rlottie-windows.ps1', 'scripts/windows-common.ps1') }}
      - uses: actions/upload-artifact@v4
        with:
          name: quill-windows-rlottie
          path: vendor/rlottie/prefix/bin/rlottie.dll
          retention-days: 3
          if-no-files-found: error

  # FFmpeg (LGPL, shared, decoders only) + the quillvideo shim, built with
  # MinGW-w64 (MSYS2 UCRT64): the DLLs import only Windows system DLLs.
  windows-ffmpeg:
    name: windows-ffmpeg
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - name: restore FFmpeg build
        id: ffmpeg-cache
        uses: actions/cache/restore@v4
        with:
          path: vendor/ffmpeg/prefix
          key: ffmpeg-windows-${{ runner.arch }}-${{ hashFiles('scripts/build-ffmpeg.sh', 'native/quillvideo/*') }}
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: false
          install: >-
            git make diffutils
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-nasm
      - name: build FFmpeg
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        run: bash scripts/build-ffmpeg.sh
      - name: save FFmpeg build
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: vendor/ffmpeg/prefix
          key: ffmpeg-windows-${{ runner.arch }}-${{ hashFiles('scripts/build-ffmpeg.sh', 'native/quillvideo/*') }}
      - uses: actions/upload-artifact@v4
        with:
          name: quill-windows-ffmpeg
          path: |
            vendor/ffmpeg/prefix/bin/*.dll
            vendor/ffmpeg/prefix/share/quillvideo/*
          retention-days: 3
          if-no-files-found: error

  windows-package:
    name: windows-package
    runs-on: windows-latest
    needs: [windows-build, windows-native, windows-rlottie, windows-ffmpeg]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - uses: actions/download-artifact@v4
        with:
          name: quill-windows-exe
          path: target/release
      - uses: actions/download-artifact@v4
        with:
          name: quill-windows-native
          path: .
      - uses: actions/download-artifact@v4
        with:
          name: quill-windows-rlottie
          path: vendor/rlottie/prefix/bin
      - uses: actions/download-artifact@v4
        with:
          name: quill-windows-ffmpeg
          path: vendor/ffmpeg/prefix
      - name: package
        shell: pwsh
        run: scripts/windows-package.ps1
      - name: check package (PE dependencies)
        shell: pwsh
        run: scripts/check-bundle-pe.ps1 dist/windows/quill-windows-x86_64
      - name: checker negative test (unbundled OpenSSL must fail)
        shell: pwsh
        run: |
          Copy-Item -Recurse dist/windows/quill-windows-x86_64 "$env:RUNNER_TEMP/neg"
          Remove-Item "$env:RUNNER_TEMP/neg/libcrypto-3-x64.dll"
          pwsh -NoProfile -File scripts/check-bundle-pe.ps1 "$env:RUNNER_TEMP/neg"
          if ($LASTEXITCODE -eq 0) { throw 'checker accepted a package missing libcrypto' }
          $global:LASTEXITCODE = 0
      - name: run from the extracted zip (clean PATH)
        shell: pwsh
        run: |
          $x = Join-Path $env:RUNNER_TEMP 'extract'
          Expand-Archive dist/windows/quill-windows-x86_64.zip $x
          $dir = Join-Path $x 'quill-windows-x86_64'
          . scripts/windows-common.ps1
          $v = Invoke-QuillExe (Join-Path $dir 'quill.exe') @('--version')
          Write-Host $v
          if ($v -notmatch '^Quill \d') { throw "unexpected --version output: $v" }
          $info = Invoke-QuillExe (Join-Path $dir 'quill.exe') @('--build-info')
          if ($info -ne 'ui') { throw "unexpected --build-info output: $info" }
          pwsh -NoProfile -File scripts/check-bundle-load.ps1 $dir
          if ($LASTEXITCODE -ne 0) { throw 'bundle load check failed' }
          foreach ($clip in 'tests/fixtures/clip-h264-aac.mp4', 'tests/fixtures/clip-vp9.webm') {
            $probe = Invoke-QuillExe (Join-Path $dir 'quill.exe') @('--video-probe', (Resolve-Path $clip).Path)
            Write-Host $probe
            if ($probe -notmatch 'frames=10') { throw "video probe failed for ${clip}: $probe" }
          }
      - uses: actions/upload-artifact@v4
        with:
          name: quill-windows-x86_64
          path: |
            dist/windows/quill-windows-x86_64.zip
            dist/windows/quill-windows-x86_64.zip.sha256
          if-no-files-found: error

  # The required macos-ui-build check is dispatched after source review through
  # quill-ui-build.yml. Public PR workflows must never target the personal Mac.

  parity:
    name: parity-fragments
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: validate parity fragments
        run: bash scripts/check-parity-fragments.sh ${{ github.event.pull_request.base.sha }}

  # Not a required check (docs/decisions/codex-legal-compliance.md): fails when a
  # crate brings a license that deny.toml does not allow, or when
  # THIRD_PARTY_LICENSES.md no longer matches Cargo.lock.
  licenses:
    name: licenses
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny@0.20.2,cargo-about@0.9.2
      - name: crate licenses are on the allow-list
        run: cargo deny --locked check licenses
      - name: THIRD_PARTY_LICENSES.md is current
        run: bash scripts/third-party-licenses.sh --check
