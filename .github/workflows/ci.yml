name: ci

on:
  push:
    branches: [main, "cursor/**"]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  linux:
    name: linux-fmt-clippy-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: app name copy
        run: bash scripts/check-app-name.sh
      - name: fmt
        run: cargo fmt --all -- --check
      - name: clippy (core)
        run: cargo clippy --no-default-features --all-targets --locked -- -D warnings
      - name: tests (core + replay)
        run: cargo test --no-default-features --locked -- --nocapture
      # The vendored X11 / Windows GPUI backends only build on their own OS;
      # their shared idle-frame decision is std-only and tested standalone.
      - name: tests (vendored GPUI frame idle)
        run: bash scripts/test-frame-idle.sh
      - name: secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          config-path: .gitleaks.toml

  # Not required checks, main only. The packaging jobs live in reusable workflows shared
  # with release.yml (docs/decisions/codex-release-pipeline.md); CI never passes
  # the Telegram credential secrets, so these builds embed nothing.
  # Linux: UI + native libs, relocatable package (docs/decisions/codex-linux-package.md).
  linux-package:
    name: linux-package
    if: github.event_name == 'push'
    uses: ./.github/workflows/package-linux.yml

  # Windows zip (docs/decisions/codex-windows-package.md).
  windows:
    name: windows
    if: github.event_name == 'push'
    uses: ./.github/workflows/package-windows.yml

  # The release's Quill.app, on a GitHub-hosted arm64 runner (never the
  # personal Mac), so release packaging breaks show up before a tag does.
  macos-package:
    name: macos-package
    if: github.event_name == 'push'
    uses: ./.github/workflows/package-macos.yml

  # Packaging runs on pushes to main only; PRs get the Linux check. The macOS UI
  # build runs after merge through quill-ui-build.yml (push to main). Public PR
  # workflows must never target the personal Mac.

  # Not a required check (docs/decisions/codex-legal-compliance.md): fails when a
  # crate brings a license that deny.toml does not allow, or when
  # THIRD_PARTY_LICENSES.md no longer matches Cargo.lock.
  licenses:
    name: licenses
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.0
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny@0.20.2,cargo-about@0.9.2
      - name: crate licenses are on the allow-list
        run: cargo deny --locked check licenses
      - name: THIRD_PARTY_LICENSES.md is current
        run: bash scripts/third-party-licenses.sh --check
