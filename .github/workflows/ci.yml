name: ci

on:
  push:
    branches: [main, "cursor/**"]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  linux:
    name: linux-fmt-clippy-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.1
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: app name copy
        run: bash scripts/check-app-name.sh
      # docs/contributing/structure.md: file size limit and shared files.
      - name: file size
        run: bash scripts/check-file-size.sh
      # docs/decisions/language-packs.md: no new hard-coded English.
      - name: interface strings
        run: python3 scripts/check-lang.py
      # docs/decisions/sweep-window-slot-scope.md: async work names its window.
      - name: window scope
        run: python3 scripts/check-window-scope.py
      - name: hotspots
        if: github.event_name == 'pull_request'
        run: bash scripts/check-hotspots.sh ${{ github.event.pull_request.base.sha }}
      - name: fmt
        run: cargo fmt --all -- --check
      - name: clippy (core)
        run: cargo clippy --no-default-features --all-targets --locked -- -D warnings
      # A test that hangs fails here instead of holding the job for 6 hours.
      - name: tests (core + replay)
        timeout-minutes: 30
        run: cargo test --no-default-features --locked -- --nocapture
      # UI integration tests: windows, dialogs and clicks against the demo
      # app. GPUI's test platform is headless (no display, no-op text
      # system), so no Xvfb; the packages are what the UI binary links.
      - name: apt dependencies (UI build)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake pkg-config nasm \
            zlib1g-dev libssl-dev libgtk-3-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libwayland-dev libxcb1-dev libx11-xcb-dev libxcb-xkb-dev libfontconfig-dev \
            libfreetype-dev libasound2-dev libvulkan-dev libdbus-1-dev libclang-dev
      - name: tests (UI, headless)
        run: cargo test --features demo-capture --locked --bin quill
      # Launch smoke (docs/decisions/ci-launch-smoke.md), pushes only so the
      # required PR check stays as it is: the real window under Xvfb with
      # Mesa lavapipe (software Vulkan). Reuses the target/ the tests just built.
      - name: apt dependencies (launch smoke)
        if: github.event_name == 'push'
        run: |
          sudo apt-get install -y --no-install-recommends \
            xvfb xauth mesa-vulkan-drivers imagemagick
      - name: build UI binary (launch smoke)
        if: github.event_name == 'push'
        run: cargo build --features demo-capture --locked --bin quill
      # Also fails when the idle window's main thread wakes more than this
      # often (docs/decisions/sweep-idle-heartbeat.md): parked frame sources
      # wake it 0 times a second, the old heartbeat 1, unparked 60.
      - name: launch smoke (Xvfb + lavapipe)
        if: github.event_name == 'push'
        env:
          IDLE_MAX_MAIN_PER_S: "0.5"
        run: bash scripts/ci-launch-smoke.sh target/debug/quill "$RUNNER_TEMP/launch-smoke"
      - name: launch smoke pictures
        if: github.event_name == 'push' && always()
        uses: actions/upload-artifact@v7
        with:
          name: launch-smoke-linux
          path: ${{ runner.temp }}/launch-smoke
          retention-days: 7
          if-no-files-found: ignore
      # The panic lints (docs/contributing/panic-safety.md) over the UI and
      # the Linux-only code. quill-webview needs WebKitGTK, so it is left out.
      # Clippy's in-tests allowances only see a plain `#[cfg(test)]`.
      - name: test cfg form
        run: "! grep -rn 'cfg(all(test' src crates --include='*.rs'"
      - name: clippy (UI)
        run: cargo clippy --features demo-capture --all-targets --locked -p quill -p quill-calls-sys -p quill-webview-protocol -- -D warnings
      # The vendored X11 / Windows GPUI backends only build on their own OS;
      # their shared idle-frame decision is std-only and tested standalone.
      - name: tests (vendored GPUI frame idle)
        run: bash scripts/test-frame-idle.sh
      - name: tests (vendored GPUI refresh interval)
        run: bash scripts/test-refresh-interval.sh
      - name: tests (vendored GPUI window list)
        run: bash scripts/test-window-list.sh
      - name: tests (vendored GPUI window messages)
        run: bash scripts/test-gpui-message.sh
      # Same for the notification extras shared by the macOS and Windows backends.
      - name: tests (vendored GPUI notification extras)
        run: bash scripts/test-notification-extras.sh
      # The vendored opus-decoder is not a workspace member; its FFT is
      # std-only and tested standalone.
      - name: tests (vendored opus-decoder FFT)
        run: bash scripts/test-opus-fft.sh
      - name: secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          config-path: .gitleaks.toml

  # Web proxy carriers against the real system web view (docs/decisions/web-proxies.md):
  # WebKitGTK under Xvfb here, WebView2 in carrier-live-windows. Not a required
  # check. The helper's clippy runs here because the UI clippy leaves it out.
  carrier-live-linux:
    name: carrier-live-linux
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.1
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: apt dependencies (WebKitGTK, Xvfb)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev \
            libsoup-3.0-dev xvfb xauth dbus-x11
      # Ubuntu 24.04 blocks the unprivileged user namespaces WebKitGTK's
      # bubblewrap sandbox needs; allow them rather than turn the sandbox off.
      - name: allow the web view sandbox
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: clippy (quill-webview)
        run: cargo clippy -p quill-webview --all-targets --locked -- -D warnings
      - name: carrier live tests (helper)
        env:
          CARRIER_SOAK_SECS: "130"
        run: dbus-run-session -- xvfb-run -a cargo test -p quill-webview --locked --test carrier_live -- --ignored --test-threads=1 --nocapture
      - name: carrier live tests (Quill's host)
        timeout-minutes: 30
        env:
          QUILL_CARRIER_HELPER: target/debug/quill-webview
          QUILL_WEBVIEW_CARRIER_LOOPBACK: "1"
        run: dbus-run-session -- xvfb-run -a cargo test --no-default-features --locked --lib helper_live -- --ignored --nocapture

  # On pushes, and on PRs that touch the carrier code (WebView2 has no other
  # PR coverage).
  carrier-live-windows:
    name: carrier-live-windows
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: carrier code changed
        id: changed
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$EVENT" != pull_request ] || git diff --name-only "$BASE"...HEAD | grep -qE '^(crates/webview-host|crates/webview-protocol|src/proxy_carrier)/|^\.github/workflows/ci\.yml$'; then
            echo run=true >> "$GITHUB_OUTPUT"
          else
            echo run=false >> "$GITHUB_OUTPUT"
          fi
      - uses: dtolnay/rust-toolchain@master
        if: steps.changed.outputs.run == 'true'
        with:
          toolchain: 1.99.1
          components: clippy
      - uses: Swatinem/rust-cache@v2
        if: steps.changed.outputs.run == 'true'
      - name: clippy (quill-webview)
        if: steps.changed.outputs.run == 'true'
        run: cargo clippy -p quill-webview --all-targets --locked -- -D warnings
      - name: carrier live tests (helper)
        if: steps.changed.outputs.run == 'true'
        env:
          CARRIER_SOAK_SECS: "130"
          # The helper's path-free trace of what WebView2 refused or cancelled.
          QUILL_WEBVIEW_DEBUG: "1"
        run: cargo test -p quill-webview --locked --test carrier_live -- --ignored --test-threads=1 --nocapture
      - name: carrier live tests (Quill's host)
        if: steps.changed.outputs.run == 'true'
        timeout-minutes: 30
        env:
          QUILL_CARRIER_HELPER: target/debug/quill-webview.exe
          QUILL_WEBVIEW_DEBUG: "1"
          QUILL_WEBVIEW_CARRIER_LOOPBACK: "1"
        run: cargo test --no-default-features --locked --lib helper_live -- --ignored --nocapture

  # Not required checks, main only. The packaging jobs live in reusable workflows shared
  # with release.yml (docs/decisions/codex-release-pipeline.md); CI never passes
  # the Telegram credential secrets, so these builds embed nothing.
  # Linux: UI + native libs, relocatable package (docs/decisions/codex-linux-package.md).
  # The call library (docs/decisions/tgcalls-engine.md) the Linux, macOS and
  # Windows packages ship; they download its artifacts from this run. Each
  # package waits for it but runs even when another target's build failed:
  # it fails only if its own library is missing (download-artifact).
  quill-calls:
    name: quill-calls
    if: github.event_name == 'push'
    uses: ./.github/workflows/quill-calls.yml

  linux-package:
    name: linux-package
    if: ${{ !cancelled() && github.event_name == 'push' }}
    needs: quill-calls
    uses: ./.github/workflows/package-linux.yml

  # Launch smoke on Windows (docs/decisions/ci-launch-smoke.md): the real window
  # on a hosted runner without a GPU (WARP). Pushes only, not a required check.
  windows-launch-smoke:
    name: windows-launch-smoke
    if: github.event_name == 'push'
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.1
      - uses: Swatinem/rust-cache@v2
      - name: build UI binary
        run: cargo build --features demo-capture --locked --bin quill
      - name: launch smoke (WARP)
        shell: pwsh
        run: scripts/ci-launch-smoke.ps1 target/debug/quill.exe "$env:RUNNER_TEMP/launch-smoke"
      - name: launch smoke pictures
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: launch-smoke-windows
          path: ${{ runner.temp }}/launch-smoke
          retention-days: 7
          if-no-files-found: ignore

  # Windows zip (docs/decisions/codex-windows-package.md).
  windows:
    name: windows
    if: ${{ !cancelled() && github.event_name == 'push' }}
    needs: quill-calls
    uses: ./.github/workflows/package-windows.yml

  # The release's Quill.app, on a GitHub-hosted arm64 runner (never the
  # personal Mac), so release packaging breaks show up before a tag does.
  macos-package:
    name: macos-package
    if: ${{ !cancelled() && github.event_name == 'push' }}
    needs: quill-calls
    uses: ./.github/workflows/package-macos.yml

  # Packaging runs on pushes to main only; PRs get the Linux check. The macOS UI
  # build runs after merge through quill-ui-build.yml (push to main). Public PR
  # workflows must never target the personal Mac.

  # Not a required check (docs/decisions/codex-legal-compliance.md): fails when a
  # crate brings a license that deny.toml does not allow, when a locked crate has
  # a RustSec vulnerability or was yanked, or when THIRD_PARTY_LICENSES.md no
  # longer matches Cargo.lock.
  licenses:
    name: licenses
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.1
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny@0.20.2,cargo-about@0.9.2
      - name: crate licenses are on the allow-list
        run: cargo deny --locked check licenses
      - name: no known vulnerabilities or yanked crates
        run: cargo deny --locked check advisories
      - name: THIRD_PARTY_LICENSES.md is current
        run: bash scripts/third-party-licenses.sh --check
