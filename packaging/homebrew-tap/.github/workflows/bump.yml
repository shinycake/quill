name: bump
# Follows Quill's releases: every few hours (and on demand) the cask is pointed
# at the latest published release, checked with brew audit, and committed.
on:
  schedule:
    - cron: '17 */3 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bump
  cancel-in-progress: false

jobs:
  bump:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - name: update the cask
        id: bump
        env:
          GITHUB_TOKEN: ${{ github.token }}
        # The assignment on its own line keeps the script's exit status:
        # inside echo "$(...)" a failure was swallowed and the job passed.
        run: |
          version=$(python3 scripts/bump-quill.py)
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: audit
        if: steps.bump.outputs.version != ''
        run: |
          brew tap-new --no-git local/check >/dev/null
          brew trust local/check
          mkdir -p "$(brew --repository local/check)/Casks"
          cp Casks/quill-app.rb "$(brew --repository local/check)/Casks/"
          brew audit --cask --online local/check/quill-app
          brew style "$(brew --repository local/check)/Casks/quill-app.rb"
      - name: commit
        if: steps.bump.outputs.version != ''
        env:
          VERSION: ${{ steps.bump.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "quill-app $VERSION"
          git push
      - name: check the cask matches the latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          latest=$(gh release view -R shinycake/quill --json tagName --jq .tagName)
          git fetch -q origin main
          cask=$(git show origin/main:Casks/quill-app.rb | sed -n 's/^  version "\(.*\)"$/\1/p')
          echo "latest release ${latest}, cask ${cask}"
          test "v${cask}" = "$latest"
