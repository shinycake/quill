# cargo-deny configuration. CI runs the license and advisory checks:
#   cargo deny check licenses
#   cargo deny check advisories
# A crate whose license is not on this list fails the `licenses` job. Before
# adding a license here, check that it is compatible with shipping Quill under
# MIT and record the decision in docs/decisions/codex-legal-compliance.md.

[graph]
# The targets Quill ships on (README "Platforms"). Crates that only build for
# other targets are not checked.
targets = [
  "aarch64-apple-darwin",
  "x86_64-unknown-linux-gnu",
  "aarch64-unknown-linux-gnu",
  "x86_64-pc-windows-msvc",
]

[advisories]
# A new RustSec vulnerability or yanked crate fails the `licenses` job, so it is
# seen on the next PR instead of the next weekly watch. Unmaintained notices are
# listed here only when the crate comes in through a dependency Quill does not
# control; each one leaves this list when that dependency moves.
ignore = [
  # Through gpui-base (GPUI Kit).
  { id = "RUSTSEC-2024-0384", reason = "instant: only via gpui-base" },
  # Through gpui-component (GPUI Kit).
  { id = "RUSTSEC-2024-0436", reason = "paste: only via gpui-component" },
  # Through resvg/usvg 0.45 and cosmic-text (GPUI's text and SVG stack).
  { id = "RUSTSEC-2026-0206", reason = "rustybuzz: only via GPUI's usvg and cosmic-text" },
  { id = "RUSTSEC-2026-0192", reason = "ttf-parser: only via GPUI's fontdb and usvg" },
  # Through syntect 5.3 (GPUI Kit's `syntect` feature, which reads its syntax set with bincode 1).
  { id = "RUSTSEC-2025-0141", reason = "bincode: only via syntect" },
  # Folded into zbus 6; held at zbus 5 with ashpd, ksni and GPUI (docs/dependency-updates.md).
  { id = "RUSTSEC-2026-0371", reason = "zbus_names: zbus 5, held" },
  { id = "RUSTSEC-2026-0370", reason = "zvariant: zbus 5, held" },
  { id = "RUSTSEC-2026-0372", reason = "zvariant_derive: zbus 5, held" },
]

[licenses]
version = 2
confidence-threshold = 0.8
# Permissive licenses, plus MPL-2.0 (file-level copyleft; Quill uses those
# crates unmodified) and the data licenses of webpki-roots (CDLA-Permissive-2.0)
# and the ICU crates (Unicode-3.0). No GPL, AGPL, LGPL or SSPL: a crate offering
# one of those only as an alternative (e.g. "Apache-2.0 OR GPL-2.0-only") passes
# because the permissive option is taken.
allow = [
  "0BSD",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "bzip2-1.0.6",
  "CC0-1.0",
  "CDLA-Permissive-2.0",
  "ISC",
  "MIT",
  "MIT-0",
  "MPL-2.0",
  "Unicode-3.0",
  "Unlicense",
  "Zlib",
]

[licenses.private]
# Quill's own crates (quill, quill-calls-sys) are MIT and unpublished.
ignore = true
